name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install ARM GCC
    run: |
      sudo apt-get update
      sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

  - name: Build
    run: make
